# --- Modul-Verfuegbarkeit ---
# Bewusste Admin-Entscheidung, welche optionalen Module aktiviert sind (siehe
# ModuleAvailabilityService in ProjectManager sowie dessen README, Abschnitt
# "Modul-Verfuegbarkeit"). Ob ein installiertes Modul gerade auch erreichbar ist, wird davon
# unabhaengig zur Laufzeit per Circuit Breaker gegen dessen Actuator-Health-Endpunkt geprueft.
modules.installed=scm-gateway,message-service,customer-service

# Erlaubt "POST /actuator/refresh" gegen ProjectManager, damit eine Aenderung an dieser Datei
# (z. B. an modules.installed) uebernommen wird, ohne den Dienst neu starten zu muessen -
# ueberschreibt die allgemeine application.properties (dort nur health,info), da diese Datei
# im Config Server hoehere Prioritaet hat.
management.endpoints.web.exposure.include=health,info,refresh

# --- Server Port ---
server.port=8080

