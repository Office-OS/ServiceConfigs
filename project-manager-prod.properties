# --- Service-Account fuer Service-zu-Service-Aufrufe (z.B. CustomerService, FileStorageService) ---
# Client Credentials Grant gegen den eigenen "internal-services"-Provider (siehe Office-OS/Authentik,
# Blueprint 70-internal-services-account.yaml) statt das JWT des eingeloggten Users weiterzureichen.
#
# token-uri MUSS die oeffentliche Authentik-Domain sein, NICHT der interne "authentik-svc"-Host
# (siehe Office-OS/Authentik README, Abschnitt "Nach dem ersten Start", Punkt 6): Authentik leitet
# die "iss"-Claim der ausgestellten Tokens vom Host ab, ueber den der Token-Request hereinkam. Alle
# Resource-Server (FileStorageService, CustomerService, ProjectManager selbst) vertrauen aber der
# oeffentlichen Domain als issuer-uri (siehe deren ServiceConfigs) - ein Token-Request gegen den
# internen Host liefert daher ein Token mit abweichender "iss"-Claim, das jeder Resource-Server mit
# 401 ablehnt. Reachability ist kein Grund, hier auf den internen Host auszuweichen: dieselbe
# oeffentliche Domain wird direkt darunter bereits erfolgreich fuer app.authentik.api.base-url
# verwendet.
app.security.internal-client.token-uri=https://authentik.nexacode.de/application/o/token/
app.security.internal-client.client-id=zAgMyN5qeD9jqvFIRTbauddAqh5EEQrgzppLC4lz
app.security.internal-client.client-secret=hWzoZ0PGsuDdJClcoGacavWH0xkl51JrYY7JgYor0EBxawY56mEiULmbMiubYeLYqyk7yusKbe5dRq1PINsUNkgq1j6IBdPEMeVmXwPgVpJADsFnAwJjocsHBKEbklV5

# --- RabbitMQ: PrintFarmService-Integration ---
# eigenes Exchange (ProjectManager -> PrintFarmService): exchange muss exakt mit
# printfarm.consumer.rabbitmq.exchange bei PrintFarmService uebereinstimmen.
printfarm.rabbitmq.exchange=task-events.exchange

# Konsum von PrintFarmServices eigenen Events: exchange/queue muessen exakt mit den gleichnamigen
# Properties bei PrintFarmService (printfarm.rabbitmq.exchange) uebereinstimmen.
printfarm.consumer.rabbitmq.exchange=printfarm-events.exchange
printfarm.consumer.rabbitmq.queue=project-manager.printfarm-events.queue