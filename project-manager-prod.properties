# --- Modul-Verfuegbarkeit ---
# Bewusste Admin-Entscheidung, welche optionalen Module aktiviert sind (siehe
# ModuleAvailabilityService in ProjectManager sowie dessen README, Abschnitt
# "Modul-Verfuegbarkeit"). Ob ein installiertes Modul gerade auch erreichbar ist, wird davon
# unabhaengig zur Laufzeit per Circuit Breaker gegen dessen Actuator-Health-Endpunkt geprueft.
# !IMPORTANT! print-farm-service ist bis zur einführung deaktiviert
modules.installed=scm-gateway,message-service,customer-service,file-storage-service,billing-hub,employee-hub

# Erlaubt "POST /actuator/refresh" gegen ProjectManager, damit eine Aenderung an dieser Datei
# (z. B. an modules.installed) uebernommen wird, ohne den Dienst neu starten zu muessen -
# ueberschreibt die allgemeine application.properties (dort nur health,info), da diese Datei
# im Config Server hoehere Prioritaet hat.
management.endpoints.web.exposure.include=health,info,refresh

# --- Server Port ---
server.port=8080

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://project_manager_db:3306/projects
spring.datasource.username=produser
spring.datasource.password=78WQ5OSdjoUPx3n8CcZwvJRA
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Offene API Endpunkte ---
# /internal/** war zuvor komplett offen - eingeschraenkt auf den Authentik-Webhook (per Shared
# Secret abgesichert, siehe AuthentikWebhookController), seit mit /internal/projects/**
# (InternalProjectController, fuer BillingHub) ein zweiter interner Endpunkt hinzukam, der
# tatsaechlich ein gueltiges JWT verlangt (siehe app.security.trusted-issuers unten) statt komplett
# offen zu sein.
app.security.permit-all-paths=/actuator/health,/internal/authentik-webhook

# ProjectManager akzeptiert hier zusaetzlich zum eigenen (project-hub-)Issuer auch vom
# "internal-services"-Provider ausgestellte JWTs, damit BillingHub /internal/projects/**
# (Projekt->Kunde-Referenz fuer neue Abrechnungen) mit einem Service-Account-Token statt einem
# User-JWT aufrufen kann - analog dazu, wie CustomerService diesen Issuer bereits vertraut.
app.security.trusted-issuers=https://authentik.nexacode.de/application/o/internal-services/

# --- Authentik ---

app.authentik.api.base-url=https://authentik.nexacode.de
