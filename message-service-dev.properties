# --- Server Port ---
server.port=8082

# Service-Account fuer Service-zu-Service-Aufrufe (FileStorageService, Rechnungs-PDF-Anhang): siehe
# app.security.internal-client.* in der zentralen application-dev.properties (gemeinsamer
# Service-Account fuer alle internen Aufrufer, daher nicht hier dupliziert).

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3306/message
spring.datasource.username=devuser
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Mail ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.username=app@dev.internal

# Test message recipient for RabbitMQTestRunner (dev only)
test.message.recipient=test@example.com