# --- Server Port ---
server.port=8083

# --- Modulare Architektur ---
# ProjectHub (ProjectManager) ist das Hauptmodul und funktioniert auch ohne die folgenden Module.
# Message-Service (E-Mail-Benachrichtigungen) und ScmGateway (GitHub-Integration) sind optionale
# Module und koennen unabhaengig voneinander deaktiviert werden, falls die jeweiligen Services in
# dieser Umgebung nicht betrieben werden - siehe ProjectManager-README "Modulare Architektur".
app.modules.message-service.enabled=true
app.modules.scm-gateway.enabled=true

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3307/projects
spring.datasource.username=devuser
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/api/**,/internal/**

