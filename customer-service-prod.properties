# --- Server Port ---
server.port=8080
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health

# --- OAuth2 Resource Server JWT ---
# CustomerService-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "customer-service",
# siehe Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://authentik.nexacode.de/application/o/customer-service/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-svc:9000/application/o/customer-service/jwks/

# ProjectManager (und kuenftige Module) rufen CustomerService intern nicht mehr mit dem JWT des
# eingeloggten Users auf (Token-Relay), sondern mit einem eigenen Service-Account-Token
# (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint 70-internal-services-account.yaml).
# Ohne diesen zusaetzlichen vertrauenswuerdigen Issuer wuerde CustomerService diese internen Aufrufe
# mit 401 ablehnen.
app.security.trusted-issuers=https://authentik.nexacode.de/application/o/internal-services/

