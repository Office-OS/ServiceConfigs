# --- ApiGateway: vertrauenswuerdige Issuer fuer Multi-Issuer JWT-Validierung ---
# Optionale Module (z.B. CustomerService) bekommen ihren eigenen Authentik-Provider mit eigenem
# Issuer statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen. Das ApiGateway prueft
# JWTs schon an der Gateway-Schwelle (bevor der Request den jeweiligen Service erreicht) und muss
# deshalb alle bekannten Issuer akzeptieren, nicht nur project-hub - sonst werden Tokens von
# customer-service (und zukuenftigen Modulen) mit 401 abgelehnt, obwohl der Login erfolgreich war.
#
# Bewusst hier und nicht mehr in der zentralen application-dev.properties: die anderen Services
# (ProjectManager, Message-Service, ...) erweitern ebenfalls BaseSecurityConfig und wuerden dieselbe
# Property sonst ungewollt mit-erben - das bringt sie beim naechsten Neustart ohne Grund vom
# schnellen Single-Issuer-Pfad (jwk-set-uri, intern) auf den Multi-Issuer-Pfad, der pro
# Extra-Issuer per OIDC-Discovery gegen die oeffentliche Authentik-URL aufloest (siehe
# Office-OS/Common, BaseSecurityConfig#multiIssuerAuthenticationManagerResolver).
app.security.trusted-issuers=http://localhost:9000/application/o/project-hub/,http://localhost:9000/application/o/customer-service/,http://localhost:9000/application/o/billing-hub/,http://localhost:9000/application/o/employee-hub/,http://localhost:9000/application/o/print-farm-service/
