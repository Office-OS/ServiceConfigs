# --- Server Port ---
server.port=8085
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# --- OAuth2 Resource Server JWT ---
# CustomerService-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "customer-service",
# siehe Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen -
# ohne diese Ueberschreibung wuerde CustomerService weiterhin gegen den geerbten project-hub-Issuer
# aus der zentralen application-dev.properties validieren und JWTs von Authentik ablehnen (401),
# obwohl der Login erfolgreich war.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/customer-service/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/customer-service/jwks/

# ProjectManager (und kuenftige Module) rufen CustomerService intern nicht mehr mit dem JWT des
# eingeloggten Users auf (Token-Relay), sondern mit einem eigenen Service-Account-Token
# (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint 70-internal-services-account.yaml).
# Ohne diesen zusaetzlichen vertrauenswuerdigen Issuer wuerde CustomerService diese internen Aufrufe
# mit 401 ablehnen.
app.security.trusted-issuers=http://localhost:9000/application/o/internal-services/

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3308/customerservice
spring.datasource.username=customerservice
spring.datasource.password=customerservice
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
