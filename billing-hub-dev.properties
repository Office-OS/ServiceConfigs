# --- Server Port ---
server.port=8087
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# --- OAuth2 Resource Server JWT ---
# BillingHub-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "billing-hub", siehe
# Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen - analog zu
# CustomerService. Ohne diese Ueberschreibung wuerde BillingHub weiterhin gegen den geerbten
# project-hub-Issuer aus der zentralen application-dev.properties validieren und JWTs von Authentik
# ablehnen (401), obwohl der Login erfolgreich war.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/billing-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/billing-hub/jwks/

# ProjectManager ruft BillingHub intern nicht auf - BillingHub selbst ist aber Aufrufer (siehe
# app.security.internal-client.* unten): Richtung CustomerService/FileStorageService/ProjectManager
# authentifiziert sich BillingHub mit einem eigenen Service-Account-Token statt dem JWT des
# eingeloggten Users (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint
# 70-internal-services-account.yaml). Damit BillingHub umgekehrt auch von anderen Services (bzw.
# kuenftig von sich selbst) mit einem solchen Token aufgerufen werden kann, vertraut es demselben
# Issuer zusaetzlich zum eigenen.
app.security.trusted-issuers=http://localhost:9000/application/o/internal-services/

# --- Service-Account fuer Service-zu-Service-Aufrufe (CustomerService, FileStorageService, ProjectManager) ---
# Dieselben Client-Credentials wie ProjectManager (siehe dessen ServiceConfigs-Eintrag) - beide
# rufen denselben "internal-services"-Provider auf, ein gemeinsamer Service-Account genuegt (siehe
# Office-OS/Authentik, Blueprint 70-internal-services-account.yaml, Abschnitt "ein zusaetzlicher,
# fester Issuer" statt eines Clients je Aufrufer).
app.security.internal-client.token-uri=http://localhost:9000/application/o/token/
app.security.internal-client.client-id=6YZV9AqaARsbIg6Pkyv0ImHOzkWdro90rQjDfSHF
app.security.internal-client.client-secret=MpM3yCCAo2jnvsqzaw1Sk3nSDh8B9gIsFi0ueoxFpgGJj24FxlPFRpI4jqwe2FXtc5X3xrNhKjYlRsMubmnxoj5Zm9EtN0vecylZfTu464mQLE7Xh11YyHKqEThXek4e

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3311/billinghub
spring.datasource.username=billinghub
spring.datasource.password=billinghub
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Billing-Events (RabbitMQ, aus ProjectManager) ---
# exchange muss exakt mit billing.rabbitmq.exchange bei ProjectManager uebereinstimmen.
billing.rabbitmq.exchange=${BILLING_RABBITMQ_EXCHANGE:billing.events.exchange}
billing.rabbitmq.queue=${BILLING_RABBITMQ_QUEUE:billing.events.billinghub.queue}
billing.rabbitmq.routing-key=${BILLING_RABBITMQ_ROUTING_KEY:#}
billing.rabbitmq.dlx=${BILLING_RABBITMQ_DLX:billing.events.billinghub.dlx}
billing.rabbitmq.dlq=${BILLING_RABBITMQ_DLQ:billing.events.billinghub.dlq}
