# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# --- SpringDoc / Swagger nur für UserService ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.doc-expansion=none

# --- API Gateway URL ---
api.gateway.url=http://localhost:8080/api

# --- OAuth2 Resource Server JWT ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/project-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/project-hub/jwks/

# --- CORS - Angular frontend origins ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204

# --- Service-Account fuer Service-zu-Service-Aufrufe (ProjectManager, BillingHub, PrintFarmService,
