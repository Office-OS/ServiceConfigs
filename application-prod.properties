# --- Eureka ---
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# --- OAuth2 Resource Server JWT ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://authentik.nexacode.de/application/o/project-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-svc:9000/application/o/project-hub/jwks/

# --- CORS - Angular frontend origins ---
app.cors.allowed-origins=https://projecthub.nexacode.de,https://customerhub.nexacode.de,https://billinghub.nexacode.de,https://employeehub.nexacode.de,https://printfarm.nexacode.de

# --- Service-Account fuer Service-zu-Service-Aufrufe (ProjectManager, BillingHub, PrintFarmService,
# Message-Service -> CustomerService/FileStorageService/EmployeeHub) ---
# Client Credentials Grant gegen den gemeinsamen "internal-services"-Provider (siehe
# Office-OS/Authentik, Blueprint 70-internal-services-account.yaml) statt das JWT des eingeloggten
# Users weiterzureichen. Ein einziger Service-Account genuegt fuer alle internen Aufrufer, daher
# hier zentral statt in jeder einzelnen <service>-prod.properties dupliziert (siehe deren
# CustomerServiceClientConfig/FileStorageServiceClientConfig/EmployeeHubClientConfig).
#
# token-uri MUSS die oeffentliche Authentik-Domain sein, NICHT der interne "authentik-svc"-Host
# (siehe Office-OS/Authentik README, Abschnitt "Nach dem ersten Start", Punkt 6): Authentik leitet
# die "iss"-Claim der ausgestellten Tokens vom Host ab, ueber den der Token-Request hereinkam. Alle
# Resource-Server (FileStorageService, CustomerService, ...) vertrauen aber der oeffentlichen
# Domain als issuer-uri (siehe deren ServiceConfigs) - ein Token-Request gegen den internen Host
# liefert daher ein Token mit abweichender "iss"-Claim, das jeder Resource-Server mit 401 ablehnt.
app.security.internal-client.token-uri=https://authentik.nexacode.de/application/o/token/
