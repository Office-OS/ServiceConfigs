# --- Eureka ---
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# --- OAuth2 Resource Server JWT ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://authentik.nexacode.de/application/o/project-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-svc:9000/application/o/project-hub/jwks/

# --- ApiGateway: vertrauenswuerdige Issuer fuer Multi-Issuer JWT-Validierung ---
# Optionale Module (z.B. CustomerService) bekommen ihren eigenen Authentik-Provider mit eigenem
# Issuer statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen. Das ApiGateway pruefft
# JWTs schon an der Gateway-Schwelle (bevor der Request den jeweiligen Service erreicht) und muss
# deshalb alle bekannten Issuer akzeptieren, nicht nur project-hub - sonst werden Tokens von
# customer-service (und zukuenftigen Modulen) mit 401 abgelehnt, obwohl der Login erfolgreich war.
app.security.trusted-issuers=https://authentik.nexacode.de/application/o/project-hub/,https://authentik.nexacode.de/application/o/customer-service/

# --- CORS - Angular frontend origins ---
app.cors.allowed-origins=https://projecthub.nexacode.de,https://customerhub.nexacode.de