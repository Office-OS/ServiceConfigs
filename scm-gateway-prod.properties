github.api.token=
# Eigenes Secret fuer die Produktivumgebung (bewusst ein anderer Wert als in
# scm-gateway-dev.properties, siehe ScmGateway docs/webhook-setup.md "Mehrere Umgebungen").
github.api.webhook-secret=8c2f5755f6c28a5f1d355ba952b20348950545b9badaca777fd62979f63902f2
# Oeffentlich erreichbar ueber das ApiGateway (nicht ueber einen eigenen Reverse-Proxy-Eintrag -
# der Rest der API bleibt bewusst intern, siehe ApiGateway-Routen-Kommentar in dessen
# application.properties): Route /scmgateway/webhooks/** -> StripPrefix -> lb://scm-gateway.
github.api.webhook-callback-url=https://api.nexacode.de/scmgateway/webhooks/github