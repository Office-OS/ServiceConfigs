# --- Server Port ---
server.port=8080
# --- Offene API Endpunkte ---
# Neben Actuator/internen Endpunkten auch alle schreibenden SCM-Endpunkte (ScmController) sowie
# den eingehenden GitHub-Webhook (GitHubWebhookController): diese werden nicht per Authentik-JWT
# abgesichert, sondern per durchgereichtem Caller-GitHub-Token (HeaderGitHubTokenProvider) bzw. -
# bei /webhooks/github - per HMAC-Signaturpruefung gegen github.api.webhook-secret. Ohne diesen
# Eintrag verlangt die securityFilterChain (auth.anyRequest().authenticated()) hier faelschlich
# ein Authentik-JWT und lehnt jeden Aufruf - inkl. der automatisierten Webhook-Einrichtung durch
# ProjectManager - mit 401 ab, bevor er ueberhaupt GitHubTokenProvider erreicht.
app.security.permit-all-paths=/actuator/health,/internal/**,/webhooks/**,/branches,/pull-requests,/mergePullRequest,/deleteBranch,/releases,/connection

# --- Datenbank (persistente Idempotenz-Pruefung fuer eingehende Webhooks) ---
# Hostname/Credentials entsprechen der neuen "scmgateway"-Ansible-Rolle in Infrastructure
# (siehe dortigen PR #9) - vor dem ersten Produktiv-Deploy sicherstellen, dass dieser PR
# gemergt und ausgerollt ist.
spring.datasource.url=jdbc:mariadb://scmgateway_db:3306/scmgateway
spring.datasource.username=scmgateway
spring.datasource.password=lkVmMjJt4oWOryuXZEpHWiOdXCrZfkf
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- GitHub API ---
# Bewusst leer: in Produktion soll ausschliesslich das per Authorization-Header durchgereichte
# Token der Aufrufer (z. B. ProjectManager) verwendet werden, kein organisationsweiter
# Fallback-Token (siehe ScmGateway-README "Authentifizierung gegenueber GitHub").
github.api.token=
# Eigenes Secret fuer die Produktivumgebung (bewusst ein anderer Wert als in
# scm-gateway-dev.properties, siehe ScmGateway docs/webhook-setup.md "Mehrere Umgebungen").
github.api.webhook-secret=8c2f5755f6c28a5f1d355ba952b20348950545b9badaca777fd62979f63902f2
# Oeffentlich erreichbar ueber das ApiGateway (nicht ueber einen eigenen Reverse-Proxy-Eintrag -
# der Rest der API bleibt bewusst intern, siehe ApiGateway-Routen-Kommentar in dessen
# application.properties): Route /scmgateway/webhooks/** -> StripPrefix -> lb://scm-gateway.
github.api.webhook-callback-url=https://api.nexacode.de/scmgateway/webhooks/github
