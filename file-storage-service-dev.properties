# --- Server Port ---
server.port=8086
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# --- OAuth2 Resource Server JWT ---
# FileStorageService hat (anders als CustomerService) KEINE eigene, interaktive Authentik-Application:
# es wird ausschliesslich von anderen Backend-Services aufgerufen, nie direkt von einem Frontend
# (siehe README, Abschnitt "Zugriffsschutz"). Der Issuer ist deshalb direkt der bereits existierende
# "internal-services"-Provider (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint
# 70-internal-services-account.yaml) statt eines zusaetzlichen, eigenen Providers.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/internal-services/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/internal-services/jwks/

# --- Datenbank (Objekt-Metadaten: Namespace, Dateiname, Checksumme, Immutable-Flag, ...) ---
spring.datasource.url=jdbc:mariadb://localhost:3310/filestorageservice
spring.datasource.username=devuser
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- MinIO (Objektspeicher fuer die eigentlichen Datei-Inhalte) ---
# Lokal laeuft FileStorageService als Host-Prozess (mvn spring-boot:run, siehe Develop-Repo), nicht
# im office_os-Docker-Netzwerk - deshalb hier der von develop.yml auf den Host gemappte Port (9002),
# nicht der interne Container-Port von MinIO.
app.storage.minio.endpoint=http://localhost:9002
app.storage.minio.access-key=officeos
app.storage.minio.secret-key=officeos-dev-only
app.storage.minio.bucket=office-os
