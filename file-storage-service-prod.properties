# --- Server Port ---
server.port=8080
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health

# --- OAuth2 Resource Server JWT ---
# FileStorageService hat (anders als CustomerService) KEINE eigene, interaktive Authentik-Application:
# es wird ausschliesslich von anderen Backend-Services aufgerufen, nie direkt von einem Frontend
# (siehe README, Abschnitt "Zugriffsschutz"). Der Issuer ist deshalb direkt der bereits existierende
# "internal-services"-Provider (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint
# 70-internal-services-account.yaml) statt eines zusaetzlichen, eigenen Providers.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://authentik.nexacode.de/application/o/internal-services/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-svc:9000/application/o/internal-services/jwks/

# --- Datenbank (Objekt-Metadaten: Namespace, Dateiname, Checksumme, Immutable-Flag, ...) ---
# Hostname/Credentials entsprechen der "filestorageservice"-Ansible-Rolle in Infrastructure.
spring.datasource.url=jdbc:mariadb://filestorageservice_db:3306/filestorageservice
spring.datasource.username=filestorageservice
spring.datasource.password=2AXl8M9bvn0BdXPCYMfJ4e4LG5d3g6
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- MinIO (Objektspeicher fuer die eigentlichen Datei-Inhalte) ---
# Interner Docker-Service-Name/Port aus der "filestorageservice"-Ansible-Rolle in Infrastructure -
# MinIO ist bewusst NICHT oeffentlich erreichbar (kein Reverseproxy-Eintrag, kein Host-Port-Mapping):
# nur FileStorageService selbst spricht diesen Container an, alle anderen Services/Frontends
# ausschliesslich ueber dessen REST-API (siehe README, Abschnitt "Architektur").
app.storage.minio.endpoint=http://minio:9000
app.storage.minio.access-key=filestorageservice
app.storage.minio.secret-key=JzoNjHjr7OObmo6JmrAgNRUtcAguCLeMx3h4pz1X
app.storage.minio.bucket=office-os

# --- Upload-Groesse ---
# Spring Boots Standardwerte (max-file-size 1MB, max-request-size 10MB) reichen fuer Rechnungs-PDFs
# aus, nicht aber fuer von PrintFarmService hochgeladenen G-Code (deutlich groesser als das
# Quell-3D-Modell - jede Schicht wird zu vielen G1-Zeilen ASCII-Text, siehe PrintFarmService/README,
# Abschnitt "Slicing"): ein realer Auftrag schlug mit 413 Payload Too Large fehl. max-http-form-post-size
# muss auf denselben Wert wie max-request-size angehoben werden, sonst weist Tomcat grosse
# Multipart-Bodies bereits vor Springs eigener (freundlicherer) Fehlermeldung ab.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-http-form-post-size=200MB
