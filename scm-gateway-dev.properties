# --- Server Port ---
server.port=8084
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/api/**,/internal/**

# --- Datenbank (persistente Idempotenz-Pruefung fuer eingehende Webhooks) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/scmgateway
spring.datasource.username=scmgateway
spring.datasource.password=scmgateway
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- GitHub API ---
# Optionaler statischer Fallback-Token, nur falls lokal ohne Authorization-Header getestet werden
# soll (siehe ScmGateway-README "Authentifizierung gegenueber GitHub"). Bei Bedarf mit einem
# eigenen GitHub Personal-Access-Token befuellen.
github.api.token=
# Zufaelliges Secret (z. B. per "openssl rand -hex 32"), mit dem eingehende GitHub-Webhooks
# signiert sind. Muss beim Einrichten des Webhooks in GitHub identisch hinterlegt werden (siehe
# ScmGateway docs/webhook-setup.md).
github.api.webhook-secret=a2f21d5f2c911a4660d715b11fe6b63a79cfadf8d6979660d4aef1291847c247
# Oeffentlich erreichbare Callback-URL fuer eingehende Webhooks, z. B. per ngrok/smee.io-Tunnel
# (siehe ScmGateway docs/webhook-setup.md) - je nach Tunnel-Session unterschiedlich, daher bewusst leer.
github.api.webhook-callback-url=