# --- Server Port ---
server.port=8089
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# --- OAuth2 Resource Server JWT ---
# PrintFarmService-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "print-farm-service",
# siehe Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen - analog
# zu CustomerService/BillingHub. Ohne diese Ueberschreibung wuerde PrintFarmService weiterhin gegen den
# geerbten project-hub-Issuer aus der zentralen application-dev.properties validieren und JWTs von
# Authentik ablehnen (401), obwohl der Login erfolgreich war.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/print-farm-service/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/print-farm-service/jwks/

# ProjectManager (und kuenftige Module) rufen PrintFarmService intern nicht mit dem JWT des
# eingeloggten Users auf (Token-Relay), sondern mit einem eigenen Service-Account-Token
# (Client Credentials Grant, siehe Office-OS/Authentik, Blueprint 70-internal-services-account.yaml).
# Ohne diesen zusaetzlichen vertrauenswuerdigen Issuer wuerde PrintFarmService diese internen Aufrufe
# mit 401 ablehnen.
app.security.trusted-issuers=http://localhost:9000/application/o/internal-services/

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3313/printfarmservice
spring.datasource.username=printfarmservice
spring.datasource.password=printfarmservice
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- RabbitMQ: eigene Events (PrintFarmService -> andere Module) ---
printfarm.rabbitmq.exchange=printfarm-events.exchange

# --- RabbitMQ: Konsum von ProjectManagers Task-Events (Task nach "In Arbeit" verschoben) ---
# exchange/queue muessen exakt mit den gleichnamigen Properties bei ProjectManager uebereinstimmen.
printfarm.consumer.rabbitmq.exchange=task-events.exchange
printfarm.consumer.rabbitmq.queue=printfarm-service.task-moved-to-progress.queue

# --- Slicer ---
printfarm.slicer.command=/usr/local/bin/prusa-slicer-console

# --- Materialkosten (EUR/Gramm) ---
printfarm.material.cost-per-gram.PLA=0.025
printfarm.material.cost-per-gram.PETG=0.03
printfarm.material.cost-per-gram.ABS=0.028
printfarm.material.cost-per-gram.TPU=0.04
