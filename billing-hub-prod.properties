# --- Server Port ---
server.port=8080
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health

# --- OAuth2 Resource Server JWT ---
# BillingHub-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "billing-hub", siehe
# Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://authentik.nexacode.de/application/o/billing-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-svc:9000/application/o/billing-hub/jwks/

# Siehe Kommentar in billing-hub-dev.properties.
app.security.trusted-issuers=https://authentik.nexacode.de/application/o/internal-services/

# --- Service-Account fuer Service-zu-Service-Aufrufe (CustomerService, FileStorageService, ProjectManager) ---
