# --- Server Port ---
server.port=8088
# --- Offene API Endpunkte ---
app.security.permit-all-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/internal/authentik-webhook

# --- OAuth2 Resource Server JWT ---
# EmployeeHub-WebApp hat einen EIGENEN Authentik-Provider/Application (Slug "employee-hub", siehe
# Office-OS/Authentik) statt den von ProjectManager-WebApp ("project-hub") mitzubenutzen - analog zu
# BillingHub/CustomerService.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/employee-hub/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/application/o/employee-hub/jwks/

# EmployeeHub wird von anderen Services (z.B. kuenftig BillingHub, fuer Stundensaetze) mit einem
# Service-Account-Token statt einem End-User-JWT aufgerufen (Client Credentials Grant, siehe
# Office-OS/Authentik, Blueprint 70-internal-services-account.yaml) - deshalb muss EmployeeHub
# diesem Issuer zusaetzlich zum eigenen vertrauen.
app.security.trusted-issuers=http://localhost:9000/application/o/internal-services/

# --- Authentik API (Webhook-Sync: Nachladen von Name/E-Mail; sowie schreibend: Anlegen/Pflegen/
# Deaktivieren von Mitarbeitern als Authentik-User, siehe AuthentikUserProvisioningService) ---
app.authentik.api.base-url=http://localhost:9000
app.authentik.api.api-token=1hmWp19dsJXhe7m2zq3426dEptvrVO00jhfiYgmWmBssL2CKCbk83WQ2nJ4v
app.authentik.webhook.secret=WQJImcEwOJhGwUGkOB2QxlPU
# Gleiche Stage wie project-manager-dev.properties - ein einziger, plattformweiter Recovery-Flow
# (siehe Office-OS/Authentik, Docs/authentik/authentik-setup.md, Abschnitt "Recovery-E-Mail beim
# Anlegen neuer User").
app.authentik.recovery.email-stage-pk=31544841-a165-446b-bd9c-2900db3de3f1

# --- Datenbank ---
spring.datasource.url=jdbc:mariadb://localhost:3312/employeehub
spring.datasource.username=employeehub
spring.datasource.password=employeehub
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
